{% load static %}
<!doctype html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2f6f3">
    <title>{% block title %}Ledenbeheer{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --ink: #17251f;
            --muted: #6a7971;
            --paper: #f2f6f3;
            --surface: #ffffff;
            --line: #dce6df;
            --green: #17634a;
            --green-dark: #124b39;
            --green-pale: #e4f1e9;
            --lime: #d8ed77;
            --coral: #e97961;
            --danger: #b93832;
            --shadow: 0 18px 45px rgba(25, 58, 42, .08);
        }

        * { box-sizing: border-box; }
        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            background-color: var(--paper);
            background-image: linear-gradient(132deg, rgba(220, 238, 225, .58), transparent 42%), repeating-linear-gradient(90deg, transparent 0 79px, rgba(30, 75, 56, .025) 80px);
            background-size: auto, 80px 80px;
            font-family: "DM Sans", "Trebuchet MS", sans-serif;
            font-size: 15px;
            line-height: 1.6;
        }
        a { color: inherit; text-decoration: none; }
        button, input { font: inherit; }
        .skip-link { position: absolute; top: -50px; left: 16px; z-index: 5; padding: 8px 12px; background: var(--surface); }
        .skip-link:focus { top: 10px; }
        .top-rule { height: 5px; background: linear-gradient(90deg, var(--green) 0 72%, var(--lime) 72% 88%, var(--coral) 88%); }
        .site-header { border-bottom: 1px solid rgba(23, 37, 31, .09); background: rgba(255, 255, 255, .72); }
        .container { width: min(1080px, calc(100% - 48px)); margin: 0 auto; }
        .header-inner { min-height: 78px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
        .brand { display: inline-flex; align-items: center; gap: 11px; font-family: Manrope, "Trebuchet MS", sans-serif; font-weight: 800; }
        .brand-mark { width: 38px; aspect-ratio: 1; display: grid; place-items: center; background: var(--green-dark); color: var(--lime); border-radius: 4px; font-size: 17px; }
        .brand-name { display: block; font-size: 15px; line-height: 1.2; }
        .brand-caption { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; font-weight: 600; }
        .main-nav { display: flex; align-items: center; gap: 27px; }
        .nav-link { color: var(--muted); font-size: 13px; font-weight: 700; }
        .nav-link[aria-current="page"] { color: var(--green-dark); }
        .button { min-height: 43px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 0 17px; border: 1px solid transparent; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 700; transition: background .18s, border-color .18s, transform .18s; }
        .button:hover { transform: translateY(-1px); }
        .button-primary { color: white; background: var(--green); }
        .button-primary:hover { background: var(--green-dark); }
        .button-primary .button-icon { color: var(--lime); font-size: 18px; line-height: 1; }
        .button-secondary { border-color: var(--line); background: var(--surface); }
        .button-secondary:hover { border-color: var(--green); }
        .page-main { min-height: calc(100vh - 148px); padding-top: 54px; padding-bottom: 72px; }
        .page-intro { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 37px; }
        .eyebrow, .section-label { margin: 0 0 9px; color: var(--green); font-size: 10px; font-weight: 800; }
        .eyebrow { display: flex; align-items: center; gap: 8px; }
        .eyebrow-mark { width: 7px; height: 7px; border-radius: 1px; background: var(--coral); transform: rotate(45deg); }
        h1, h2, p { margin-top: 0; }
        h1, h2 { font-family: Manrope, "Trebuchet MS", sans-serif; }
        h1 { margin-bottom: 8px; font-size: 36px; font-weight: 800; line-height: 1.16; }
        .page-subtitle { margin: 0; color: var(--muted); font-size: 14px; }
        .intro-stamp { display: grid; justify-items: end; padding-bottom: 4px; }
        .intro-stamp strong { color: var(--coral); font-family: Manrope, sans-serif; font-size: 30px; line-height: 1; }
        .intro-stamp span { margin-top: 7px; color: var(--muted); font-size: 9px; font-weight: 800; }
        .section-toolbar { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 16px; }
        .section-label { margin-bottom: 5px; color: var(--muted); }
        .section-toolbar h2 { margin: 0; font-size: 20px; }
        .count { display: inline-block; margin-left: 5px; padding: 2px 7px; border-radius: 3px; color: var(--green-dark); background: var(--green-pale); font-family: "DM Sans", sans-serif; font-size: 11px; vertical-align: 3px; }
        .table-panel, .form-panel { overflow: hidden; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); box-shadow: var(--shadow); }
        .table-caption { min-height: 42px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 19px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 9px; font-weight: 800; }
        .table-scroll { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 12px 19px; color: var(--muted); background: #f8faf8; font-size: 10px; font-weight: 800; }
        td { padding: 15px 19px; border-top: 1px solid #edf1ee; font-size: 13px; }
        tbody tr:hover { background: #fbfdfb; }
        .person-cell { display: flex; align-items: center; gap: 11px; min-width: 180px; font-weight: 700; }
        .avatar { width: 34px; aspect-ratio: 1; display: grid; flex: 0 0 auto; place-items: center; border-radius: 50%; color: var(--green-dark); background: var(--green-pale); font-family: Manrope, sans-serif; font-size: 12px; font-weight: 800; }
        .status { display: inline-flex; align-items: center; gap: 7px; color: var(--green); font-size: 11px; font-weight: 700; }
        .status::before { width: 6px; aspect-ratio: 1; border-radius: 50%; background: #56a37e; content: ""; }
        .empty-cell { padding: 44px 20px; text-align: center; }
        .empty-symbol { width: 42px; aspect-ratio: 1; display: grid; place-items: center; margin: 0 auto 12px; border: 1px solid var(--line); border-radius: 50%; color: var(--green); font-size: 22px; }
        .empty-cell strong { display: block; margin-bottom: 4px; font-family: Manrope, sans-serif; font-size: 14px; }
        .empty-cell span { color: var(--muted); font-size: 12px; }
        .form-panel { max-width: 700px; }
        .panel-heading { padding: 19px 24px; border-bottom: 1px solid var(--line); }
        .panel-heading p { margin: 0; color: var(--muted); font-size: 12px; }
        .panel-heading strong { display: block; margin-bottom: 3px; font-family: Manrope, sans-serif; font-size: 15px; }
        .member-form { padding: 25px 24px 22px; }
        .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 18px; }
        .field-phone { grid-column: 1 / -1; }
        .field label { display: block; margin-bottom: 7px; font-size: 12px; font-weight: 700; }
        .field-input { width: 100%; min-height: 45px; padding: 10px 12px; border: 1px solid #d6e0d9; border-radius: 3px; outline: none; color: var(--ink); background: #fbfcfb; transition: border-color .15s, box-shadow .15s; }
        .field-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(23, 99, 74, .12); background: white; }
        .field-error, .errorlist { margin: 6px 0 0; padding: 0; color: var(--danger); font-size: 11px; list-style: none; }
        .form-actions { display: flex; justify-content: end; gap: 10px; margin-top: 26px; padding-top: 19px; border-top: 1px solid var(--line); }
        .success-panel { max-width: 700px; display: grid; grid-template-columns: 72px 1fr; align-items: start; gap: 20px; padding: 30px; border: 1px solid #d7e7dc; border-left: 4px solid var(--green); border-radius: 5px; background: var(--surface); box-shadow: var(--shadow); }
        .success-mark { width: 58px; aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; color: var(--green-dark); background: var(--lime); font-family: Manrope, sans-serif; font-size: 13px; font-weight: 800; }
        .success-panel h2 { margin: 0 0 7px; font-size: 21px; }
        .success-panel p { margin: 0; color: var(--muted); font-size: 13px; }
        .success-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 21px; }
        .site-footer { border-top: 1px solid rgba(23, 37, 31, .1); background: rgba(255, 255, 255, .48); }
        .footer-inner { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 10px; }
        .footer-mark { color: var(--green); font-weight: 800; }
        @media (max-width: 640px) {
            .container { width: min(100% - 32px, 1080px); }
            .header-inner { min-height: 68px; }
            .main-nav { gap: 13px; }
            .nav-link { display: none; }
            .button { min-height: 40px; padding: 0 12px; }
            .page-main { min-height: calc(100vh - 132px); padding-top: 36px; padding-bottom: 48px; }
            .page-intro { margin-bottom: 29px; }
            h1 { font-size: 30px; }
            .intro-stamp { display: none; }
            .section-toolbar { align-items: center; }
            .section-toolbar h2 { font-size: 17px; }
            .table-caption { padding: 0 13px; }
            th, td { padding-right: 13px; padding-left: 13px; }
            .form-panel { width: 100%; }
            .panel-heading { padding: 17px 18px; }
            .member-form { padding: 20px 18px; }
            .field-grid { grid-template-columns: 1fr; gap: 16px; }
            .field-phone { grid-column: auto; }
            .success-panel { grid-template-columns: 48px 1fr; gap: 13px; padding: 22px 18px; }
            .success-mark { width: 44px; }
            .success-panel h2 { font-size: 18px; }
            .footer-inner { min-height: 58px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#main">Ga naar inhoud</a>
    <div class="top-rule" aria-hidden="true"></div>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="{% url 'member-list' %}">
                <span class="brand-mark" aria-hidden="true">L</span>
                <span><span class="brand-name">Ledenbeheer</span><span class="brand-caption">MEMBERS / ADMIN</span></span>
            </a>
            <nav class="main-nav" aria-label="Hoofdnavigatie">
                <a class="nav-link" href="{% url 'member-list' %}" {% if request.resolver_match.url_name == 'member-list' %}aria-current="page"{% endif %}>Leden</a>
                <a class="button button-primary" href="{% url 'member-create' %}"><span class="button-icon" aria-hidden="true">+</span> Nieuw lid</a>
            </nav>
        </div>
    </header>
    <main class="container page-main" id="main">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="container footer-inner">
            <span class="footer-mark">LEDENBEHEER</span>
            <span>Registratie en ledenoverzicht</span>
        </div>
    </footer>
</body>
</html>
